name: Step 0 # Start Exercise

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

env:
  STEP_1_FILE: ".github/steps/1-step.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.3
    with:
      exercise-title: "Azure SRE with GitHub Copilot"
      intro-message: "Work three AKS incidents with GitHub Copilot as your SRE agent, and approve every fix yourself."

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Set step workflow states
        run: |
          # The toolkit's disable step can run before a new copy has registered its workflows
          # (HTTP 404, ignored), which leaves Steps 2 and 3 active. Set every step's state here.
          api() { for _ in 1 2 3 4 5 6; do gh api "$@" && return; sleep 5; done; return 1; }
          for wf in 2-step.yml 3-last-step.yml; do
            state=$(api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state)
            if [ "$state" = active ]; then api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"; fi
          done
          api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/1-step.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
